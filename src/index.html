<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: file:">
  <title>Nyx Terminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booting">
  <header id="titlebar">
    <div class="brand" title="Nyx Terminal">
      <svg class="brand-moon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="moon-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient>
          <mask id="moon-cut"><rect width="24" height="24" fill="#fff"/><circle cx="16.5" cy="8" r="7.2" fill="#000"/></mask>
        </defs>
        <circle cx="11" cy="13" r="8.5" fill="url(#moon-grad)" stroke="none" mask="url(#moon-cut)"/>
        <circle cx="19" cy="15.5" r="1" fill="var(--accent2)" stroke="none"/>
        <circle cx="16.5" cy="20" r=".6" fill="var(--accent)" stroke="none"/>
      </svg>
    </div>
    <div id="tabs" role="tablist"><div id="tab-indicator"></div></div>
    <div class="tab-actions">
      <button id="new-tab" class="icon-btn" title="Nouvel onglet (Ctrl+Shift+T)">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <button id="profiles-btn" class="icon-btn" title="Profils, serveurs et options">
        <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
      </button>
    </div>
    <div class="drag-space"></div>
    <button id="split-btn" class="icon-btn" title="Diviser le panneau (Alt+Maj+D)">
      <svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M8 3v10"/></svg>
    </button>
    <button id="customize-btn" class="icon-btn" title="Personnaliser (Ctrl+Maj+,)">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><circle cx="6" cy="6.3" r=".9" fill="currentColor"/><circle cx="9.8" cy="6" r=".9" fill="currentColor"/><circle cx="10.4" cy="9.4" r=".9" fill="currentColor"/><path d="M6.5 10.8c.8.4 1.2-.2 1.3-.8"/></svg>
    </button>
    <button id="palette-btn" class="icon-btn palette-btn" title="Palette de commandes (Ctrl+Shift+P)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13 13"/></svg>
      <span>Commandes</span><kbd>Ctrl+Shift+P</kbd>
    </button>
  </header>

  <div id="profile-menu" class="menu hidden" role="menu"></div>

  <main id="terminals">
    <div id="bg-layer" aria-hidden="true"></div>
    <div id="glow" aria-hidden="true"><span class="orb a"></span><span class="orb b"></span><span class="orb c"></span></div>
  </main>

  <footer id="statusbar">
    <div class="sb-left">
      <button id="sb-profile" class="sb-item sb-profile" title="Nouvel onglet"><i class="dot"></i><span></span></button>
      <button id="sb-cwd" class="sb-item sb-cwd hidden" title="Ouvrir le dossier dans l'Explorateur">
        <svg viewBox="0 0 16 16"><path d="M2 4.5c0-.8.7-1.5 1.5-1.5h2.8l1.4 1.5h4.8c.8 0 1.5.7 1.5 1.5v5.5c0 .8-.7 1.5-1.5 1.5h-9c-.8 0-1.5-.7-1.5-1.5z"/></svg><span></span>
      </button>
      <span id="sb-title" class="sb-item sb-title"></span>
    </div>
    <div class="sb-right">
      <span id="sb-running" class="sb-item sb-running hidden"><i class="spinner"></i><span></span></span>
      <span id="sb-tabs" class="sb-item" title="Onglets et panneaux"></span>
      <span id="sb-size" class="sb-item" title="Colonnes × lignes"></span>
      <button id="sb-zoom" class="sb-item" title="Réinitialiser le zoom (Ctrl+0)"></button>
      <button id="sb-theme" class="sb-item sb-theme" title="Changer de thème"><span class="sb-swatch"></span><span></span></button>
    </div>
  </footer>

  <div id="search" class="floating hidden">
    <svg class="search-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13 13"/></svg>
    <input id="search-input" placeholder="Rechercher…" spellcheck="false" autocomplete="off">
    <span id="search-count"></span>
    <button id="search-case" class="icon-btn toggle" title="Respecter la casse">Aa</button>
    <button id="search-regex" class="icon-btn toggle" title="Expression régulière">.*</button>
    <button id="search-prev" class="icon-btn" title="Précédent (Maj+Entrée)"><svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg></button>
    <button id="search-next" class="icon-btn" title="Suivant (Entrée)"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
    <button id="search-close" class="icon-btn" title="Fermer (Échap)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>

  <div id="palette-backdrop" class="hidden">
    <div id="palette" role="dialog" aria-label="Palette de commandes">
      <div class="palette-head">
        <svg viewBox="0 0 16 16"><path d="M5 4l4 4-4 4"/></svg>
        <input id="palette-input" placeholder="Tape une commande, un thème, un serveur…" spellcheck="false" autocomplete="off">
      </div>
      <div id="palette-list" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> naviguer</span><span><kbd>Entrée</kbd> valider</span><span><kbd>Échap</kbd> fermer</span></div>
    </div>
  </div>

  <!-- Tiroir de personnalisation (thème, fond, police) -->
  <aside id="drawer" class="hidden" aria-label="Personnaliser">
    <div class="drawer-head">
      <h2>Personnaliser</h2>
      <button id="drawer-close" class="icon-btn" title="Fermer (Échap)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="seg drawer-tabs" role="tablist">
      <button data-pane="colors" class="on">Couleurs</button>
      <button data-pane="background">Fond</button>
      <button data-pane="font">Police</button>
    </div>
    <div id="drawer-body"></div>
    <div id="drawer-foot"></div>
  </aside>

  <!-- Fenêtre modale (serveurs SSH) -->
  <div id="modal-backdrop" class="hidden"><div id="modal" role="dialog"></div></div>

  <div id="size-hud" class="hidden"></div>
  <div id="toast"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="themes.js"></script>
  <script src="renderer.js"></script>
  <script src="blocks.js"></script>
  <script src="palette.js"></script>
  <script src="customize.js"></script>
  <script src="servers.js"></script>
  <script src="boot.js"></script>
</body>
</html>
