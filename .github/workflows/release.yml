# Compile Nyx Terminal pour Windows sur les serveurs de GitHub.
#
# - tag « v* » (ex. v0.4.0)  -> Release GitHub avec les .exe et leurs empreintes SHA-256
# - bouton « Run workflow »  -> compile sans publier (les .exe sont dans les artefacts du run)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Installer les dépendances
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Compiler l'installeur et le .exe portable
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Préparer les fichiers et calculer les empreintes SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/*.exe release/
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Conserver les fichiers compilés
        uses: actions/upload-artifact@v7
        with:
          name: nyx-terminal-windows
          path: release/*

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
